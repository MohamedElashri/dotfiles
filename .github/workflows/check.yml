name: Check dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test shell on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test installers and workflows
        run: python3 -m unittest discover -s tests -v
      - name: Check generated preferences and private data
        run: |
          python3 scripts/render_configs.py --check
          python3 scripts/check_private.py --worktree
          git diff --check
